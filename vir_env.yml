name: Radar_HuPR
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # 基础
  - python=3.10

  # CUDA工具链
  - cuda-version=12.8
  - cuda-toolkit=12.8
  - cudnn=9

  # PyTorch相关
  - pytorch=2.8.0
  - torchvision=0.23.0
  - torchaudio=2.8.0

  # 科学计算
  - numpy>=1.24
  - scipy>=1.10
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - jupyter

  # 图像处理
  - pillow>=10.0
  - opencv

  # 工具
  - cython
  - tqdm
  - pyyaml
  - easydict
  - ipython

  # 编译工具
  - ninja
  - cmake
  - make

  # pip包
  - pip
  - pip:
    - tensorly==0.6.0
    - pycocotools  # 从pip安装
    - albumentations
    - seaborn